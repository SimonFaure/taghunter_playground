[package]
name = "taghunter-playground"
version = "1.1.0"
description = "Tag Hunter Playground"
authors = ["Tag Hunter"]
edition = "2021"

[lib]
name = "taghunter_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compiles the WebView2 inspector (DevTools) into the binary AND auto-opens it
# at boot (see the #[cfg(feature = "devtools")] block in lib.rs setup). OFF for
# stable/production bundles - DevTools is stripped out. The Tester channel build
# is produced with `npm run tauri:build:test` (= VITE_QA_HARNESS=1 +
# `tauri build --features devtools`): the env var keeps the window.__* QA
# harnesses in the JS bundle (main.tsx gates them), the feature keeps DevTools
# to invoke them from. Re-exports tauri's own `devtools` feature.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-os = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
serialport = "4"
regex = "1"
tokio = { version = "1", features = ["time", "process", "rt", "rt-multi-thread", "macros", "net", "sync", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = "0.8"
tokio-rusqlite = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
mdns-sd = "0.13"
rand = "0.8"
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# SportIdent reader stack (moved from feature-gated to mandatory after the
# step-7 cutover deleted the legacy JS path).
tokio-serial = "5"
async-trait = "0.1"
bytes = "1"

# Streaming SHA-256 for the content-addressed scenario blob pool: verify a
# downloaded media blob's bytes against the studio-advertised hash without
# buffering a multi-hundred-MB video in the WebView heap (sha256_file command).
sha2 = "0.10"

# LAN app updates: a mother checks an installer a satellite pushes to it against
# the updater signing key (same scheme as tauri-plugin-updater) before offering
# it to other devices (update_cache.rs).
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
# Paused-clock tests (`#[tokio::test(start_paused = true)]`) for the SportIdent
# reader's handshake retry / read watchdog / stale-frame timers.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    # legacy_net_cleanup: one-shot stop of a hotspot left on by a pre-router
    # build (WinRT tethering). Drop both with that module.
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    # cp210x_driver: SetupDi* device enumeration + ShellExecuteExW UAC-elevated
    # SportIdent driver installer.
    # ShellExecuteExW lives under Win32_UI_Shell, not Win32_System_ShellAPI
    # (the latter is not a windows-rs feature flag), and is additionally
    # gated on Win32_System_Registry (SHELLEXECUTEINFOW has an HKEY field).
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

# Desktop-only: app self-update + OS autostart. The Tauri updater cannot
# self-install on mobile (Android/iOS go through the app stores), and
# launch-on-boot is a desktop-only concept - so these are gated to desktop
# targets and registered behind #[cfg(desktop)] in lib.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

# Tauri 2 mobile entry-point (compiled in for android/ios targets).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { version = "2", features = [] }

# SportIdent Android transport: raw JNI bridge to SportIdentSerial.kt.
# Rust → Kotlin (list/open/write/close) and Kotlin → Rust (rx-bytes/rx-error/
# rx-closed callbacks) both cross JNI directly - ByteArray ↔ Vec<u8> is the
# native exchange shape. See sportident/transport/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
